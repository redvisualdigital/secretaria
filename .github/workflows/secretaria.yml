name: secretaria
on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 min, o dia todo (as mensagens só saem na janela de config/secretaria)
  workflow_dispatch:
    inputs:
      forcar: { description: 'Ignorar o horario (teste)', type: boolean, default: false }
concurrency: { group: secretaria, cancel-in-progress: false }
jobs:
  essence-glam:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: node motor.js
        env:
          FIREBASE_SA: ${{ secrets.ESSENCE_FIREBASE_SA }}
          UAZ_URL: ${{ secrets.UAZ_URL }}
          UAZ_TOKEN: ${{ secrets.ESSENCE_UAZ_TOKEN }}
          TESTE: ${{ vars.ESSENCE_TESTE }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
