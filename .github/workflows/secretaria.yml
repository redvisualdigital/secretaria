name: secretaria
# O cron do GitHub atrasa e pula rodadas. Por isso cada execução fica ligada ~5h40,
# rodando o motor a cada 2 min; o cron só reinicia o ciclo (a fila guarda 1 execução esperando).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      forcar: { description: 'Ignorar o horario (teste)', type: boolean, default: false }
      voltas: { description: 'Quantas voltas de 2 min (1 = rodada unica)', type: string, default: '170' }
concurrency: { group: secretaria, cancel-in-progress: false }
jobs:
  essence-glam:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - name: motor (a cada 2 min)
        env:
          FIREBASE_SA: ${{ secrets.ESSENCE_FIREBASE_SA }}
          UAZ_URL: ${{ secrets.UAZ_URL }}
          UAZ_TOKEN: ${{ secrets.ESSENCE_UAZ_TOKEN }}
          TESTE: ${{ vars.ESSENCE_TESTE }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
          VOLTAS: ${{ inputs.voltas || '170' }}
        run: |
          for i in $(seq 1 "$VOLTAS"); do
            timeout 600 node motor.js || echo "rodada $i falhou"
            [ "$i" -lt "$VOLTAS" ] && sleep 110
          done
