name: secretaria
# O cron do GitHub atrasa e pula rodadas. Por isso cada execução fica ligada ~5h40,
# rodando o motor a cada 2 min pra cada cliente; o cron só reinicia o ciclo (a fila guarda 1 execução esperando).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      forcar: { description: 'Ignorar o horario (teste)', type: boolean, default: false }
      voltas: { description: 'Quantas voltas de 2 min (1 = rodada unica)', type: string, default: '170' }
concurrency: { group: secretaria, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - name: motor (a cada 2 min, todas as clientes)
        env:
          UAZ_URL: ${{ secrets.UAZ_URL }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
          VOLTAS: ${{ inputs.voltas || '170' }}
          ESS_SA: ${{ secrets.ESSENCE_FIREBASE_SA }}
          ESS_UAZ: ${{ secrets.ESSENCE_UAZ_TOKEN }}
          ESS_TESTE: ${{ vars.ESSENCE_TESTE }}
          CAR_SA: ${{ secrets.CAROL_FIREBASE_SA }}
          CAR_UAZ: ${{ secrets.CAROL_UAZ_TOKEN }}
        run: |
          roda() { CLIENTE="$1" FIREBASE_SA="$2" UAZ_TOKEN="$3" TESTE="$4" timeout 600 node motor.js || echo "[$1] rodada falhou"; }
          for i in $(seq 1 "$VOLTAS"); do
            roda lyslie "$ESS_SA" "$ESS_UAZ" "$ESS_TESTE"
            [ -n "$CAR_SA" ] && roda carol "$CAR_SA" "$CAR_UAZ" ""
            if [ "$i" -lt "$VOLTAS" ]; then sleep 100; fi
          done
      # ao terminar o ciclo, a própria secretária dispara o próximo (o cron do GitHub falha e não dá pra depender dele)
      - name: religar
        if: always() && (inputs.voltas == '' || inputs.voltas == '170')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run secretaria.yml --ref main
